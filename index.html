<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- SVG first for browsers that take it; the PNGs cover the rest, and the
         180px one is what iOS uses when the app is added to a home screen. -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Monochrome silhouette for Safari's pinned tabs and the browser
         sidebars that tint their own icon. -->
    <link rel="mask-icon" href="./mask-icon.svg" color="#5b51d8" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Qwertzy — catch a thought, get a checklist. Notes turn into tasks, tasks open into threads, everything filed by month."
    />
    <title>Qwertzy</title>
    <script>
      // Theme and accent are applied before first paint, so there's no flash of
      // the wrong colours. Mirrors lib/settings.ts — keep the two in step.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('qwertzy.settings.v1') || '{}');
          var theme = s.theme;
          if (!theme) {
            var old = localStorage.getItem('qwertzy.theme') || localStorage.getItem('listify.theme');
            theme = old === 'dark' || old === 'light' ? old : 'system';
          }
          var dark =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : theme === 'dark';
          if (dark) document.documentElement.classList.add('dark');
          if (s.accent) document.documentElement.dataset.accent = s.accent;
          if (s.motion) document.documentElement.dataset.motion = s.motion;
        } catch (e) {
          /* private mode — fall back to the light default */
        }
      })();
    </script>
    <script type="module" crossorigin src="/Qwertzy/assets/index-Bbbl3JYS.js"></script>
    <link rel="stylesheet" crossorigin href="/Qwertzy/assets/index-ZVdm37_U.css">
  </head>
  <body>
    <div id="root"></div>

    <!--
      Shown only when the app never mounts — main.tsx removes it on start. The
      case it exists for: GitHub Pages set to "Deploy from a branch → main",
      which serves this file as-is, so the module below 404s and the page would
      otherwise be silently, unhelpfully blank.
    -->
    <div
      id="boot-fallback"
      style="
        max-width: 30rem;
        margin: 18vh auto 0;
        padding: 0 1.5rem;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
        color: #4a4640;
      "
    >
      <p style="font: 600 19px/1.3 ui-serif, Georgia, serif; color: #201e1b">
        Qwertzy didn’t load.
      </p>
      <p style="margin-top: 0.75rem">
        This page is serving the app’s source rather than a built copy, so there’s nothing to run.
      </p>
      <p style="margin-top: 0.75rem; color: #7a7264">
        On GitHub Pages, set <strong>Settings → Pages → Source</strong> to
        <strong>GitHub Actions</strong>, or to <strong>Deploy from a branch → gh-pages</strong>.
        Serving <code>main</code> at root can’t work: that publishes the repository, not the site.
      </p>
    </div>

  </body>
</html>
