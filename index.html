<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Qwertzy — catch a thought, get a checklist. Notes turn into tasks, tasks open into threads, everything filed by month."
    />
    <title>Qwertzy</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong background.
      (function () {
        try {
          var saved =
            localStorage.getItem('qwertzy.theme') || localStorage.getItem('listify.theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
